<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe6;--fg:#222;--card:#fff;--line:#ddd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--card:#222530;--line:#3a3d4a}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--card:#222530;--line:#3a3d4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px}
h1{margin:0;font-size:1.4rem}
canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:10px;background:#1b2038}
.stage{position:relative;width:min(100%,900px)}
.net{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,24,.88);border-radius:10px;padding:10px}
.net[hidden]{display:none}
.card{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:18px 22px;text-align:center;width:min(360px,100%)}
.card h3{margin:0 0 10px;font-size:1.1rem}
.nb{font:inherit;font-weight:700;padding:10px 18px;margin:5px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.nb.pri{background:#e8590c;color:#fff;border:0}
.code{font:700 38px monospace;letter-spacing:.18em;margin:8px 0;user-select:all}
.nst{min-height:1.4em;font-size:.9rem;opacity:.85;margin:6px 0}.nst.err{color:#e5484d;opacity:1}
#codeIn{font:700 28px monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase;width:92%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#exitBtn{font:inherit;font-weight:700;padding:8px 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.keys{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:min(100%,900px)}
.keys div{flex:1;min-width:250px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;line-height:1.7}
.keys b{display:block;margin-bottom:4px}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-family:monospace;font-weight:700}
</style>
</head>

        else if(d.k==='e'&&conn===c&&typeof d.t==='string'){(subs[d.t]||[]).slice().forEach(f=>{try{f({topic:d.t,data:d.d,peer:c.peer,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false})}catch(e){}})}});

      on:(t,f)=>{(subs[t]=subs[t]||[]).push(f);return()=>{subs[t]=(subs[t]||[]).filter(g=>g!==f)}},
      presence:async patch=>{pres={...pres};for(const k in patch){if(patch[k]===null)delete pres[k];else pres[k]=patch[k]}send({k:'p',p:pres});notify()},

      catch(e){
        if(tok!==net.tok)return;
        if(role==='host'&&e.code==='unavailable-id'&&tr<3){code=genCode(true);const el=document.getElementById('ncode');if(el)el.textContent=code;continue}
        const M={'peer-unavailable':'找不到這個代碼的房間：請確認房主已生成代碼並停在等待畫面','full':'這個房間已經有兩位玩家了','timeout':'連不上配對伺服器，請檢查網路後再試','network':'連不上配對伺服器，請檢查網路後再試','server-error':'配對伺服器暫時無法使用，請稍後再試'};
        setSt(M[e.code]||('連線失敗（'+(e.code||'錯誤')+'）'),1);return}
    }
    if(!rm)return;
  }else{
    try{R=await probeNative()}catch(e){}
    if(tok!==net.tok)return;
    if(!R){setSt('這個代碼是「Claude 房間」模式，只能在 claude.ai 登入後用原頁面連線。請讓房主勾選「使用 P2P 直連」重新生成代碼（P 開頭）',1);return}
    try{rm=await R.join('nf-'+code.toLowerCase())}catch(e){if(tok===net.tok)setSt('連線失敗（'+((e&&e.code)||'錯誤')+'），請稍後再試，或改用 P2P 模式',1);return}
    if(tok!==net.tok){try{rm.leave()}catch(e){}return}
  }
  const onErr=e=>{if(tok===net.tok)setSt('連線錯誤：'+((e&&e.code)||'未知')+'（可改用 P2P 模式）',1)};
  net.room=rm;net.role=role;net.code=code;ms=role==='host'?0:1;net.opp=null;net.gid=0;net.on=false;
  net.unsubs=[rm.onPeers(netPeers,onErr),rm.on('in',onIn,onErr),rm.on('sync',onSync,onErr),rm.on('rtc',onRtc,onErr),rm.on('png',m=>{if(!m.isMe&&m.data&&typeof m.data.t==='number')rm.emit('pog',{t:m.data.t}).catch(()=>{})},onErr),rm.on('pog',m=>{if(!m.isMe&&m.data&&typeof m.data.t==='number'){const r=performance.now()-m.data.t;if(r>=0&&r<3000)net.rtt=net.rtt*.7+r*.3}},onErr)];
  net.pg=setInterval(()=>{if(net.room)netEmit('png',{t:performance.now()})},700);
  rm.presence({role:role,ph:'lobby',gid:0,sel:{i:0,late:false,ok:0}}).catch(()=>{});
  if(!p2p&&!mqtt)setTimeout(()=>{if(tok===net.tok&&!net.on&&rm.connected&&!rm.connected())setSt('尚未連上 Claude 房間服務（此頁面或帳號可能沒有聯線權限）。請改用「P2P 直連」',1)},4500);
  if(role==='host')setSt('等待對手輸入此代碼…（請保持此畫面）');
  else{setSt('尋找房間…');net.jt=setTimeout(()=>{if(tok===net.tok&&!net.on){netLeave();setSt('找不到這個代碼的房間：請確認房主已生成代碼並停在等待畫面',1)}},9000)}
}
function netPeers(){
  const rm=net.room;if(!rm)return;const ps=rm.peers(),me=ps.find(p=>p.sameTab);if(!me)return;
  const others=ps.filter(p=>!p.isMe&&p.kind==='viewer');
  if(net.role==='host'){
    if(net.opp){if(!ps.some(p=>p.peer===net.opp)){net.opp=null;net.on=false;net.sendUntil=0;rtcClose();rm.presence({g:null,ph:'lobby'}).catch(()=>{});state='title';showNet('host',{code:net.code,msg:'對手已離線，等待新的對手輸入代碼…'})}}
    else{const g=others.find(p=>p.presence&&p.presence.role==='guest');if(g){net.opp=g.peer;rm.presence({g:g.peer}).catch(()=>{});enterSelect()}}
  }else{
    const h=others.find(p=>p.presence&&p.presence.role==='host');
    if(!net.on){
      if(h){if(h.presence.g&&h.presence.g!==me.peer){netLeave();setSt('這個房間已經有兩位玩家了',1)}
        else if(h.presence.g===me.peer){net.opp=h.peer;clearTimeout(net.jt);enterSelect()}}
    }else if(!ps.some(p=>p.peer===net.opp)){netLeave();state='title';showNet('info',{msg:'房主已離開，連線結束'})}
  }
}
const remote=()=>net.room&&net.room.peers().find(p=>p.peer===net.opp);
function pushSel(){if(!net.room)return;const s=sel[ms];net.room.presence({ph:'select',gid:net.gid,sel:{i:s.i,late:!!s.late,ok:s.ok?1:0}}).catch(()=>{})}
function enterSelect(){rtcStart();net.on=true;ai=false;state='select';closeNet();sel=[{i:0,ok:0},{i:9,ok:0}];net.sendUntil=0;pushSel()}
function netSel(){
  const s=sel[ms],o=sel[1-ms],p=pr[ms];const b=s.i+'|'+!!s.late+'|'+s.ok;
  if(!s.ok){
    const c=s.i%8,r=Math.floor(s.i/8);
    if(p.l)s.i=r*8+(c+7)%8;if(p.r)s.i=r*8+(c+1)%8;
    if(p.u&&r)s.i-=8;if(p.d&&r<4)s.i+=8;
    if(LATE[s.i]===undefined)s.late=false;else if(p.s1)s.late=!s.late;if(p.a)s.ok=1;
  }else if(p.ch)s.ok=0;
  if(b!==s.i+'|'+!!s.late+'|'+s.ok)pushSel();
  const r=remote();let go=false;
  if(r&&r.presence&&r.presence.sel&&typeof r.presence.sel.i==='number'){
    const rp=r.presence;o.i=Math.max(0,Math.min(NB-1,rp.sel.i|0));o.late=!!rp.sel.late&&LATE[o.i]!==undefined;
    const rdy=rp.sel.ok&&((rp.ph==='select'&&rp.gid===net.gid)||(rp.ph==='fight'&&rp.gid===net.gid+1));
    o.ok=rdy?1:0;go=!!rdy;
  }else o.ok=0;
  if(s.ok&&go)startOnline();
}

/* WebRTC 直連升級：用現有房間當信令，連上後遊戲封包改走 DataChannel（延遲最低），失敗自動回到原路徑 */
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}];
function rtcOpen(){return !!(net.dc&&net.dc.readyState==='open')}
function netEmit(t,d){
  if(rtcOpen()){try{net.dc.send(JSON.stringify({t:t,d:d}));return}catch(e){}}
  if(net.room)net.room.emit(t,d).catch(()=>{});
}
function rtcClose(){try{net.dc&&net.dc.close()}catch(e){}try{net.pc&&net.pc.close()}catch(e){}net.dc=null;net.pc=null;net.rq=[];clearTimeout(net.rt)}
function rtcMsg(e){
  let o;try{o=JSON.parse(e.data)}catch(x){return}
  if(!o||typeof o.t!=='string')return;const m={isMe:false,peer:net.opp,data:o.d};
  if(o.t==='in')onIn(m);else if(o.t==='sync')onSync(m);
  else if(o.t==='png'){if(o.d&&typeof o.d.t==='number')netEmit('pog',{t:o.d.t})}
  else if(o.t==='pog'){if(o.d&&typeof o.d.t==='number'){const r=performance.now()-o.d.t;if(r>=0&&r<3000)net.rtt=net.rtt*.7+r*.3}}
}
function rtcStart(){
  if(net.pc||!window.RTCPeerConnection||!net.room||!net.opp)return;
  let pc;try{pc=new RTCPeerConnection({iceServers:ICE})}catch(e){return}
  net.pc=pc;net.rq=[];const tok=net.tok;
  pc.onicecandidate=e=>{if(e.candidate&&net.room&&net.pc===pc)net.room.emit('rtc',{k:'i',c:e.candidate.toJSON?e.candidate.toJSON():e.candidate}).catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(net.pc===pc&&(pc.connectionState==='failed'||pc.connectionState==='closed')){net.dc=null}};
  const setDc=dc=>{dc.onmessage=rtcMsg;dc.onopen=()=>{if(net.pc===pc){net.dc=dc;net.chg=true}};dc.onclose=()=>{if(net.dc===dc)net.dc=null}};
  if(net.role==='host'){
    setDc(pc.createDataChannel('nf',{ordered:false,maxRetransmits:0}));
    pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>{if(net.room&&net.pc===pc)net.room.emit('rtc',{k:'o',s:pc.localDescription.sdp}).catch(()=>{})}).catch(()=>{});
  }else{
    pc.ondatachannel=e=>setDc(e.channel);
    const ask=n=>{if(tok!==net.tok||net.pc!==pc||rtcOpen()||n>4)return;if(net.room)net.room.emit('rtc',{k:'r'}).catch(()=>{});net.rt=setTimeout(()=>ask(n+1),2500)};
    ask(0);
  }
}
function onRtc(m){
  if(m.isMe||m.peer!==net.opp)return;const d=m.data;if(!d||typeof d.k!=='string')return;
  const flush=()=>{const pc=net.pc;if(!pc)return;const q=net.rq;net.rq=[];q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}))};
  if(d.k==='r'){if(net.role==='host'){if(net.pc&&!rtcOpen()){rtcClose()}rtcStart()}}
  else if(d.k==='o'&&net.role==='guest'&&typeof d.s==='string'){
    const pc=net.pc;if(!pc)return;
    pc.setRemoteDescription({type:'offer',sdp:d.s}).then(()=>{flush();return pc.createAnswer()}).then(a=>pc.setLocalDescription(a)).then(()=>{if(net.room&&net.pc===pc)net.room.emit('rtc',{k:'a',s:pc.localDescription.sdp}).catch(()=>{})}).catch(()=>{});
  }else if(d.k==='a'&&net.role==='host'&&typeof d.s==='string'){
    const pc=net.pc;if(!pc)return;pc.setRemoteDescription({type:'answer',sdp:d.s}).then(flush).catch(()=>{});
  }else if(d.k==='i'&&d.c&&net.pc){
    if(net.pc.remoteDescription)net.pc.addIceCandidate(d.c).catch(()=>{});else net.rq.push(d.c);
  }
}
const RBMAX=30,SNW=48;
function localD(){return(net.rtt||80)>140?3:2}
function netInit(){net.f=0;net.buf=[{},{}];net.have=-1;net.rack=-1;net.pp=0;net.acc=0;net.stallT=0;net.pend={};net.ls=0;net.lr=performance.now();net.sendUntil=0;net.snap={};net.ur={};net.rb=null;net.lastR=0;net.rhi=-1;net.rf=-1;net.rft=0;net.sy=29;net.fin=false;net.D=localD();for(let i=0;i<net.D;i++)net.buf[ms][i]=0;net.rec=net.D;net.nrb=0;net.lastS=0;net.chg=true}
function startOnline(){net.gid++;netInit();newGame();net.room.presence({ph:'fight',gid:net.gid}).catch(()=>{})}
function maskIn(m){return{held:{l:!!(m&1),r:!!(m&2),d:!!(m&4),ch:!!(m&8),b:!!(m&512)},pr:{u:!!(m&16),a:!!(m&32),s1:!!(m&64),s2:!!(m&128),ult:!!(m&256)}}}
function sampleInput(){const h=held[ms];const m=(h.l?1:0)|(h.r?2:0)|(h.d?4:0)|(h.ch?8:0)|(h.b?512:0)|net.pp;net.pp=0;return m}
function simFrame(){
  const f=net.f;
  net.snap[f]=snapGet();delete net.snap[f-SNW];
  if(net.rec<=f+net.D){const sm=sampleInput();if(sm!==net.lastS){net.lastS=sm;net.chg=true}net.buf[ms][net.rec++]=sm;const hm=sm&527;while(net.rec<=f+net.D)net.buf[ms][net.rec++]=hm}
  const mine=net.buf[ms][f];let rr=net.buf[1-ms][f];if(rr===undefined)rr=net.lastR&527;
  net.ur[f]=rr;delete net.ur[f-SNW];
  update(1/60,[maskIn(ms===0?mine:rr),maskIn(ms===0?rr:mine)]);
  net.f++;
}
function doRollback(){
  const rb=net.rb;net.rb=null;
  if(rb===null||rb>=net.f)return;
  const S=net.snap[rb];if(!S)return;
  const cur=net.f;snapSet(S);net.f=rb;
  RS=true;try{while(net.f<cur&&state==='fight')simFrame()}finally{RS=false}
  net.nrb++;
}
function applyDelta(d){
  const f=d.f,S=net.snap[f+1];if(!S)return;
  const cl=v=>Math.max(0,Math.min(100,v));
  for(let i=0;i<2;i++){
    const dh=d.v[i]-S.fs[i].hp,dc=d.v[2+i]-S.fs[i].ch;
    if(Math.abs(dh)<.01&&Math.abs(dc)<.01)continue;
    const fix=o=>{o.hp=cl(o.hp+dh);if(dh)o.hpY=Math.max(o.hpY,o.hp);o.ch=cl(o.ch+dc)};
    for(let g=f+1;g<net.f;g++){const Q=net.snap[g];if(Q)fix(Q.fs[i])}
    fix(fs[i]);
  }
}
function netFight(dt){
  const now=performance.now();let sc=1;
  if(net.rf>=0){const rn=net.rf+((now-net.rft)/1000+(net.rtt||80)/2000)*60,adv=net.f-rn;if(Math.abs(adv)>2.5)sc=Math.max(.88,Math.min(1.12,1-adv*.02))}
  net.acc=Math.min(net.acc+dt*sc,.25);
  if(net.rb!==null)doRollback();
  let n=0,stalled=false;
  while(state==='fight'&&net.acc>=1/60&&n<8){
    if(net.f-(net.have+1)>=RBMAX){stalled=true;break}
    simFrame();net.acc-=1/60;n++;
  }
  if(state!=='fight')net.acc=0;
  if(stalled){net.stallT+=dt;net.acc=Math.min(net.acc,.1)}else net.stallT=0;
  if(net.rb===null){
    if(ms===0){for(let g=0;g<4;g++){const S=net.snap[net.sy+1];
      if(S&&net.have>=net.sy){netEmit('sync',{g:net.gid,f:net.sy,v:[S.fs[0].hp,S.fs[1].hp,S.fs[0].ch,S.fs[1].ch]});net.sy+=30}
      else{if(net.f>net.sy+SNW)net.sy+=30;else break}}}
    else for(const k in net.pend){const d=net.pend[k];
      if(d.f+1<net.f-SNW){delete net.pend[k];continue}
      if(net.snap[d.f+1]&&net.have>=d.f){applyDelta(d);delete net.pend[k]}}
  }
  if(state==='over'){net.sendUntil=now+5000;if(net.rb===null&&net.have>=net.f-1)net.fin=true}else net.fin=false;
  netSend(net.chg);net.chg=false;
}
function netSend(force){
  const t=performance.now();if(!net.room||(!force&&t-net.ls<50))return;net.ls=t;
  const hi=net.rec-1,from=Math.max(0,net.rack+1);let d='';
  for(let k=from;k<=hi&&d.length<1500;k++)d+=String.fromCharCode(256+(net.buf[ms][k]||0));
  netEmit('in',{g:net.gid,s:ms,f:from,a:net.have,c:net.f,d:d});
}
function onIn(m){
  if(m.isMe||m.peer!==net.opp)return;const d=m.data;
  if(!d||d.g!==net.gid||d.s!==1-ms||typeof d.f!=='number'||typeof d.d!=='string'||d.d.length>2000)return;
  const now=performance.now();net.lr=now;const sd=d.s;
  if(typeof d.c==='number'&&d.c>=net.rf){net.rf=d.c;net.rft=now}
  for(let i=0;i<d.d.length;i++){const v=d.d.charCodeAt(i)-256,k=d.f+i;
    if(v>=0&&v<1024&&net.buf[sd][k]===undefined){
      net.buf[sd][k]=v;if(k>net.rhi){net.rhi=k;net.lastR=v}
      if(k<net.f&&net.ur[k]!==undefined&&net.ur[k]!==v)net.rb=net.rb===null?k:Math.min(net.rb,k)}}
  while(net.buf[sd][net.have+1]!==undefined)net.have++;
  if(typeof d.a==='number')net.rack=Math.max(net.rack,d.a);
}
function onSync(m){
  if(m.isMe||m.peer!==net.opp||ms===0)return;const d=m.data;
  if(!d||d.g!==net.gid||typeof d.f!=='number'||!Array.isArray(d.v)||d.v.length!==4||d.v.some(v=>typeof v!=='number'))return;
  net.pend[d.f]=d;
}
let last=performance.now();
function loop(n){
  const rd=Math.min((n-last)/1000,.25),dt=Math.min(rd,.05);last=n;
  if(state==='fight'||(state==='over'&&net.on&&!net.fin)){if(net.on)netFight(rd);else update(dt)}else if(state==='select')selStep();
  if(net.on&&state!=='fight'&&performance.now()<net.sendUntil)netSend();
  pr[0]={};pr[1]={};
  draw();drawAU();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
